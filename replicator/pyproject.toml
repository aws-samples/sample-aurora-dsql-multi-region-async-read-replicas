[project]
name = "dsql-replicator"
version = "0.1.0"
description = "Aurora DSQL multi-region async replicator (CDC → Kinesis → applier → target DSQL)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Rajesh Kantamani" }]
license = { text = "Apache-2.0" }
dependencies = [
    "boto3>=1.34",
    "aioboto3>=13.1",
    "click>=8.1",
    "psycopg[binary]>=3.2",
    "rich>=13.7",
    "structlog>=24.1",
    "pydantic>=2.7",
    "crc32c>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.11",
    "types-boto3>=1.0.2",
    "moto[dynamodb,sqs,sns,cloudwatch]>=5.0",
]

[project.scripts]
dsql-replicator = "dsql_replicator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsql_replicator"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "C4", "PT", "RET",
    "ASYNC", "LOG", "G", "TID",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "PT011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
mypy_path = "src"
packages = ["dsql_replicator"]
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
module = ["aioboto3.*", "boto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
